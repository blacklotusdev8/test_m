[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project]
name = "hello-server"
version = "0.1.0"
description = "testing Mcp server"
authors = [
    {name = "Black lotus", email = "your.email@example.com"}
]

requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.14.0",
    "annotated-types==0.7.0",
"anyio==4.10.0",
"art==6.5",
"attrs==25.3.0",
"browserforge==1.2.3",
"camoufox==0.4.11",
"certifi==2025.8.3",
"cffi==2.0.0",
"charset-normalizer==3.4.3",
"click==8.2.1",
"cssselect==1.3.0",
"curl-cffi==0.13.0",
"filelock==3.19.1",
"greenlet==3.2.4",
"h11==0.16.0",
"httpcore==1.0.9",
"httpx==0.28.1",
"httpx-sse==0.4.1",
"idna==3.10",
"jsonschema==4.25.1",
"jsonschema-specifications==2025.9.1",
"language-tags==1.2.0",
"lxml==6.0.1",
"markdown-it-py==4.0.0",
"mcp==1.14.0",
"mdurl==0.1.2",
"msgspec==0.19.0",
"numpy==2.3.3",
"orjson==3.11.3",
"platformdirs==4.4.0",
"playwright==1.55.0",
"pycparser==2.23",
"pydantic==2.11.9",
"pydantic-core==2.33.2",
"pydantic-settings==2.10.1",
"pyee==13.0.0",
"pygments==2.19.2",
"pysocks==1.7.1",
"python-dotenv==1.1.1",
"python-multipart==0.0.20",
"pyyaml==6.0.2",
"rebrowser-playwright==1.52.0",
"referencing==0.36.2",
"requests==2.32.5",
"requests-file==2.1.0",
"rich==14.1.0",
"rpds-py==0.27.1",
"scrapling==0.3.4",
"screeninfo==0.8.1",
"shellingham==1.5.4",
"smithery==0.1.25",
"sniffio==1.3.1",
"sse-starlette==3.0.2",
"starlette==0.48.0",
"tldextract==5.3.0",
"toml==0.10.2",
"tqdm==4.67.1",
"typer==0.17.4",
"typing-extensions==4.15.0",
"typing-inspection==0.4.1",
"ua-parser==1.0.1",
"ua-parser-builtins==0.18.0.post1",
"urllib3==2.5.0",
"uvicorn==0.35.0",
]

[project.scripts]
# Run the MCP server in development mode
dev = "smithery.cli.dev:main"
# Run server with interactive testing playground
playground = "smithery.cli.playground:main"

[tool.smithery]
# Function that returns a patched FastMCP server
server = "hello_server.server:create_server"


